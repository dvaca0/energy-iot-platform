<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Energy IQ mark">
  <defs>
    <linearGradient id="mark-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="mark-bolt" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="92" height="92" rx="24" fill="url(#mark-bg)"/>

  <!-- Measurement trace: the signal the platform actually samples. -->
  <path d="M14 66 L26 66 L32 52 L38 74 L44 60 L50 60"
        fill="none" stroke="#BFDBFE" stroke-opacity="0.55"
        stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Bolt -->
  <path d="M56 16 L32 52 L46 52 L40 80 L66 42 L51 42 Z" fill="url(#mark-bolt)"/>
</svg>
