# ===========================================================================
# energy-node hardening — SINGLE CANONICAL CONFIGURATION
# ===========================================================================
# Every tunable parameter for the hardening package lives here. No module may
# hardcode a threshold, interval, path or address. This file is the only thing
# that should differ between N001, N002 and N003.
#
# Format: KEY=VALUE, shell- and python-parseable. No spaces around '='.
# Node identity (NODE_ID, CENTRAL_API_URL, sensor addresses) stays in
# node.env, which this package never modifies.
# ===========================================================================

# --- paths -----------------------------------------------------------------
EN_ROOT=/opt/energy-node
EN_NODE_ENV=/opt/energy-node/config/node.env
EN_DB_DIR=/opt/energy-node/database
EN_STATE_DIR=/opt/energy-node/state
EN_POWER_DB=/opt/energy-node/database/power_telemetry.db

# --- canonical heartbeat ---------------------------------------------------
# ONE producer (the collector), ONE payload, many consumers.
HEARTBEAT_ENABLED=1
# Seconds between heartbeats. The backend's monitoring config expects 60 and
# derives missed_beats from it; changing this desynchronises alert timing.
HEARTBEAT_INTERVAL=60
HEARTBEAT_TIMEOUT=10
# Canonical endpoint: the one the monitoring subsystem actually consumes.
HEARTBEAT_PATH=/api/monitoring/heartbeat
#
# TRANSITIONAL — remove once the backend patch in backend/ is deployed.
# Verified 2026-08-03: POSTing to /api/monitoring/heartbeat does NOT update
# last_sync, which drives /api/nodes status and the dashboards. Until the
# backend collapses the two endpoints, the single producer must also publish
# sync state to the legacy path or dashboards go stale.
# THIS IS NOT A SECOND PRODUCER — it is one producer, one payload, two
# transports. Set to 0 the moment the backend patch is live.
# auto = negotiate from the backend response (correct). 1/0 to force.
# The node stops legacy publishing BY ITSELF once the backend patch is live,
# so this transitional path has an automatic end-of-life.
HEARTBEAT_LEGACY_EDGE_PUBLISH=auto
HEARTBEAT_LEGACY_EDGE_PATH=/api/edge/heartbeat

# --- power / UPS telemetry logger ------------------------------------------
POWERLOG_ENABLED=1
POWERLOG_SAMPLE_HZ=1.0
POWERLOG_RING_SECONDS=300
POWERLOG_PERSIST_EVERY=5
POWERLOG_RAIL_EVERY=30
POWERLOG_RETENTION_DAYS=14
POWERLOG_EVENT_RETENTION_DAYS=365
POWERLOG_PRUNE_EVERY=3600

# --- UPS hardware discovery ------------------------------------------------
UPS_ENABLED=1
UPS_I2C_BUS=1
# Drivers are probed in this order; first positive identification wins.
# Unknown hardware is reported as present-but-unidentified and NEVER guessed.
UPS_DRIVER_ORDER=waveshare_hat_d,waveshare_hat_e
# Battery thresholds used for local alerting only (never for shutdown unless
# the corresponding recovery module is explicitly enabled).
UPS_BATTERY_LOW_V=3.15
UPS_ON_BATTERY_MA=-50

# --- undervoltage reporting ------------------------------------------------
# Edge-triggered, not sticky. Firmware bits 16/18 only clear on reboot, so
# reporting them would pin node.undervoltage at ERROR forever and add to the
# alert fatigue that already buried the real signal.
UNDERVOLT_WINDOW_SECONDS=600

# --- verification ----------------------------------------------------------
VERIFY_MEASUREMENT_MAX_AGE=300
VERIFY_HEARTBEAT_MAX_AGE=180
VERIFY_DISK_MAX_PERCENT=85
VERIFY_BUFFER_MAX_PENDING=500

# ===========================================================================
# RECOVERY MODULES — every one independently switchable
# ===========================================================================
# Each module states what it recovers and what it cannot. All experimental
# mechanisms ship DISABLED and must stay disabled until validated in a
# maintenance window. An untested recovery path creates false confidence.

# --- Layer 1: hardware watchdog (managed by the OS, we only verify it) ------
# RECOVERS: kernel freeze/deadlock.  CANNOT RECOVER: unpowered SoC.
# NOTE: this was ALREADY ACTIVE during the 2026-08-01 failure and did not
# help, because the SoC had no power. Verification only, we do not arm it.
WATCHDOG_VERIFY=1
WATCHDOG_EXPECT_TIMEOUT=60

# --- Layer 2: Recovery Manager (the deterministic pipeline) -----------------
# The state machine that owns escalation. Probes each stage in dependency
# order, remedies the FIRST failing stage only, and escalates to a bounded
# reboot solely when service-level recovery is exhausted.
#
# RECOVERS: any stage that fails to come up or stops working - filesystem,
#   clock, network, sensor, collector, measurements, heartbeat.
# CANNOT RECOVER: an unpowered or latched SoC. See layers 7 and 8.
#
# OBSERVE-ONLY computes and logs every decision but actuates nothing. A
# recovery mechanism nobody has watched is not trustworthy; leave this at 1
# until the journal has been reviewed on a real node.
RECOVERY_OBSERVE_ONLY=1
RECOVERY_INTERVAL_S=60

# Service-level recovery comes first, always.
RECOVERY_REMEDY_ATTEMPTS=3
RECOVERY_REMEDY_BACKOFF_INITIAL=30
RECOVERY_REMEDY_BACKOFF_MAX=300

# Reboot budget: at most this many reboots inside this rolling window. Beyond
# it the node enters SAFE MODE rather than rebooting again.
RECOVERY_REBOOT_MAX=3
RECOVERY_REBOOT_WINDOW_S=1800

# TEST HOOK. Enters and HOLDS SAFE MODE with no fault present, so the AP, the
# portal, the retry cadence and the exit path can be validated on a live node.
# Clearing it leaves SAFE MODE on the next tick. MUST be 0 in production.
RECOVERY_FORCE_SAFE_MODE=0

# SAFE MODE is NOT permanent. The node keeps attempting full recovery this
# often, forever, so it never needs a human merely because it gave up.
RECOVERY_SAFE_MODE_RETRY_S=900
# ...and may attempt ONE more reboot after this long, in case the fault was
# fixed externally (power restored, access point put back). Without it a node
# that entered SAFE MODE during a site outage would never reboot again even
# once the site returned. With it the worst case is four reboots a day, which
# is bounded and is not a loop.
RECOVERY_SAFE_MODE_REBOOT_AFTER_S=21600

# Stage classification. LOCAL means a reboot is a plausible remedy; EXTERNAL
# means it never is. A node must not reboot itself over a backend outage, a
# Shelly someone unplugged, or a Tailscale drop - rebooting cannot fix any of
# them, and a node that tries turns somebody else's outage into a loop.
# Override per node, e.g. a node whose sensor is an ADS1256 on its own SPI bus
# should set RECOVERY_STAGE_SENSOR_CLASS=local.
RECOVERY_STAGE_FILESYSTEM_CLASS=local
RECOVERY_STAGE_CLOCK_CLASS=local
RECOVERY_STAGE_NETWORK_CLASS=local
RECOVERY_STAGE_TAILSCALE_CLASS=external
RECOVERY_STAGE_SENSOR_CLASS=external
RECOVERY_STAGE_COLLECTOR_CLASS=local
RECOVERY_STAGE_MEASUREMENTS_CLASS=local
RECOVERY_STAGE_BACKEND_CLASS=external
RECOVERY_STAGE_HEARTBEAT_CLASS=local

# --- Layer 3: collector self-heal ------------------------------------------
# RECOVERS: collector alive but not measuring.
# CANNOT RECOVER: a node that is fully down.
# SUPERSEDED by the Recovery Manager above, which owns escalation and the
# reboot budget. Kept for manual use; its timer must stay disabled while the
# Recovery Manager runs, or two actuators decide independently to reboot.
RECOVERY_SELF_HEAL=0
RECOVERY_STALE_SECONDS=600

# --- Layer 4: escalate to reboot after repeated failures -------------------
# RECOVERS: wedged userspace a unit restart cannot clear.
# CANNOT RECOVER: unpowered SoC / PMIC latch.
RECOVERY_AUTO_REBOOT=0
RECOVERY_AUTO_REBOOT_AFTER_FAILURES=3

# --- Layer 5: UPS "boot when power applied" (0x55 arm register) ------------
# EXPERIMENTAL — UNTESTED. MUST REMAIN 0.
# RECOVERS: mains outage -> battery flat -> shutdown -> mains returns -> boot.
# CANNOT RECOVER: the 2026-08-01 failure. That had NO power transition for the
# MCU to detect, because the rail never went down.
RECOVERY_UPS_ARM_ON_SHUTDOWN=0

# --- Layer 6: RTC wake alarm -----------------------------------------------
# EXPERIMENTAL — UNTESTED. MUST REMAIN 0.
# The RTC provably kept running through the entire 43h37m outage, so the
# domain survives a latch. Whether firmware wakes the board from an
# UNEXPECTED latch is undocumented. This is the only remaining software hope
# for recovering the Aug 1 failure mode without new hardware.
RECOVERY_RTC_WAKE=0
RECOVERY_RTC_WAKE_SECONDS=1800
RECOVERY_RTC_DEVICE=/sys/class/rtc/rtc0/wakealarm

# --- Layer 6b: GPIO wake ---------------------------------------------------
# EXPERIMENTAL — UNTESTED. MUST REMAIN 0.
# The UPS HAT (D) MCU wakes the Pi by pulling GPIO3 (SCL) low. This module
# prepares the framework only; nothing drives the pin.
# CANNOT RECOVER: anything, while disabled.
RECOVERY_GPIO_WAKE=0
RECOVERY_GPIO_WAKE_PIN=3

# --- logging ---------------------------------------------------------------
LOG_LEVEL=INFO

# --- Layer 7: external relay power-cycle -----------------------------------
# EXPERIMENTAL - UNWIRED. MUST REMAIN 0.
# One of only TWO mechanisms that can recover the 2026-08-01 brownout latch.
# Must cut the UPS HAT's Type-C INPUT (cutting the Pi's 5V rail does nothing -
# the battery keeps it alive). The cycle decision must come from a peer or the
# backend: a latched node cannot command its own power cycle.
RECOVERY_RELAY=0
RECOVERY_RELAY_BACKEND=none

# --- Layer 8: external hardware watchdog -----------------------------------
# EXPERIMENTAL - UNWIRED. MUST REMAIN 0.
# The ONLY layer that can recover an unpowered SoC, because its counter lives
# outside the SoC. The internal bcm2835 watchdog was already active during the
# 2026-08-01 failure and could not fire - the SoC had no power.
RECOVERY_EXTERNAL_WATCHDOG=0
RECOVERY_EXTERNAL_WATCHDOG_DEVICE=none
RECOVERY_EXTERNAL_WATCHDOG_PET_SECONDS=30

# --- doctor thresholds ------------------------------------------------------
DOCTOR_MEM_WARN=85
DOCTOR_MEM_FAIL=95
DOCTOR_LOAD_WARN=1.5
DOCTOR_LOAD_FAIL=3.0
DOCTOR_TEMP_WARN=70
DOCTOR_TEMP_FAIL=80

# --- measurement hardware ---------------------------------------------------
# Declares the expected sensor kind. shelly | ads1256 | smart_plugs
#
# DO NOT LEAVE THIS BLANK. Blank means auto-detect, and sensors.discover()
# auto-detects by preferring whichever source is *reachable*:
#     primary = next((f for f in found if f.reachable), None)
# So when the Shelly died on N002 (2026-08-10 18:53-21:05) discovery silently
# fell through to the smart plugs, which were fine, and the sensor check
# reported PASS while the node's primary meter was unreachable for two hours.
# The measurement stage then escalated as a LOCAL fault and drove the recovery
# ladder to SAFE MODE - three reboots, for a dead device no reboot can fix.
#
# Pinning the kind makes an unreachable primary meter report FAIL, which is
# EXTERNAL, which never reboots.
SENSOR_KIND=shelly

# --- black-box recorder (Phase J) -------------------------------------------
# Durable boot records + reboot-reason classification. Forensics only; it
# recovers nothing. The RTC discriminator it encodes is what made both the
# 2026-08-01 and 2026-08-03 outages diagnosable.
BLACKBOX_ENABLED=1
EN_BLACKBOX_DB=/opt/energy-node/database/blackbox.db
