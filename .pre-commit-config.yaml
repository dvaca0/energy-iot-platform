# Install once:  pip install pre-commit && pre-commit install
# Run manually:  pre-commit run --all-files
#
# These hooks mirror the CI workflows. If they pass locally, lint CI passes.

default_language_version:
  python: python3

exclude: |
  (?x)^(
      backend/venv/ |
      .*/node_modules/ |
      .*_backup_.*/ |
      frontend/dist/ |
      backend/migrations/versions/ |
      assets/branding/.*\.svg
  )

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-added-large-files
        # The database, backups and node_modules are ignored, so anything this
        # size arriving is a mistake.
        args: [--maxkb=2048]
      - id: detect-private-key
      - id: check-executables-have-shebangs

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
        # Formatting is black's job; ruff-format is disabled to avoid two
        # formatters disagreeing.
        stages: [manual]

  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        args: [--line-length=100]

  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: [--profile=black, --line-length=100]

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        types_or: [javascript, jsx, ts, tsx, css, json, yaml, markdown]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        # The platform holds three credentials, all in backend/.env. This is the
        # last line of defence before one reaches a remote — where it must be
        # treated as compromised regardless of any later history rewrite.

  - repo: local
    hooks:
      - id: no-secrets-in-tracked-files
        name: refuse tracked .env / key material
        language: system
        pass_filenames: false
        entry: >
          bash -c 'if git ls-files | grep -qiE "(^|/)\.env$|\.pem$|\.key$"; then
          echo "A secret-bearing file is tracked. See docs/Security.md."; exit 1; fi'
