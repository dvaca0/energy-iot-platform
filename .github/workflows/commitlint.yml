name: Commit messages

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  commitlint:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install
        run: npm install --no-save @commitlint/cli@19 @commitlint/config-conventional@19

      # Only the commits the PR adds are checked. Rewriting history to satisfy
      # a linter that was adopted later is worse than an inconsistent log.
      - name: Lint PR commits
        run: |
          npx commitlint \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to "${{ github.event.pull_request.head.sha }}" \
            --verbose
